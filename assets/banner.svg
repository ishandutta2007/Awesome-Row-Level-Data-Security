<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="pulseCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="pulsePurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Filter for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    /* Continuous Keyframe Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    @keyframes dataScanLine {
      0% { transform: translateY(0px); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(180px); opacity: 0; }
    }
    @keyframes flowRight {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-15px) translateX(8px); opacity: 0.8; }
    }
    @keyframes rotateShield {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .anim-pulse { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
    .anim-scan { animation: dataScanLine 4s linear infinite; }
    .anim-flow { stroke-dasharray: 10, 10; animation: flowRight 12s linear infinite; }
    .anim-float1 { animation: floatParticle 5s ease-in-out infinite; }
    .anim-float2 { animation: floatParticle 7s ease-in-out infinite 1.5s; }
    .anim-float3 { animation: floatParticle 6s ease-in-out infinite 3s; }
  </style>

  <!-- Deep Backdrop -->
  <rect width="1200" height="360" rx="12" fill="url(#bgGrad)" />

  <!-- Animated Ambient Aura/Glow Blobs (Deep Background) -->
  <g class="anim-pulse">
    <circle cx="200" cy="180" r="160" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>
    <circle cx="1020" cy="180" r="170" fill="#818cf8" opacity="0.14" filter="url(#glow)"/>
    <circle cx="600" cy="280" r="180" fill="#a855f7" opacity="0.1" filter="url(#glow)"/>
  </g>

  <!-- Grid Layer (Architectural Blueprint) -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="0.75">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- Left Dynamic Data Row Isolation Graphic (Behind & Flanking Text) -->
  <g transform="translate(60, 80)">
    <!-- Simulated Database Table Outline -->
    <rect x="0" y="0" width="160" height="190" rx="8" fill="#131b2e" stroke="#1e293b" stroke-width="1.5" />
    <path d="M 0 35 L 160 35" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="15" cy="18" r="4" fill="#38bdf8" />
    <circle cx="28" cy="18" r="4" fill="#818cf8" />
    <circle cx="41" cy="18" r="4" fill="#c084fc" />
    <text x="60" y="22" fill="#64748b" font-size="11" font-weight="600">TABLE_DATA</text>

    <!-- Table Rows -->
    <!-- Row 1: Tenant A (Granted) -->
    <rect x="8" y="44" width="144" height="26" rx="4" fill="#0c4a6e" fill-opacity="0.6" stroke="#0284c7" stroke-width="1" />
    <text x="16" y="61" fill="#38bdf8" font-size="10" font-weight="700">ROW_101  [TENANT_A]  ✓</text>

    <!-- Row 2: Tenant B (Denied/Masked) -->
    <rect x="8" y="78" width="144" height="26" rx="4" fill="#2d1527" fill-opacity="0.6" stroke="#e11d48" stroke-width="1" stroke-dasharray="3,3" />
    <text x="16" y="95" fill="#f43f5e" font-size="10" font-weight="700">ROW_102  [RESTRICTED] ✕</text>

    <!-- Row 3: Tenant A (Granted) -->
    <rect x="8" y="112" width="144" height="26" rx="4" fill="#0c4a6e" fill-opacity="0.6" stroke="#0284c7" stroke-width="1" />
    <text x="16" y="129" fill="#38bdf8" font-size="10" font-weight="700">ROW_103  [TENANT_A]  ✓</text>

    <!-- Row 4: Tenant C (Masked Hash) -->
    <rect x="8" y="146" width="144" height="26" rx="4" fill="#1e1b4b" fill-opacity="0.6" stroke="#6366f1" stroke-width="1" />
    <text x="16" y="163" fill="#a5b4fc" font-size="10" font-weight="700">ROW_104  [SHA256_MASK] 🔒</text>

    <!-- Moving Scanner Light Effect -->
    <g class="anim-scan">
      <line x1="4" y1="10" x2="156" y2="10" stroke="#38bdf8" stroke-width="2" filter="url(#softGlow)"/>
    </g>
  </g>

  <!-- Right Dynamic Security Policy / Tokenization Graphic -->
  <g transform="translate(970, 75)">
    <!-- Background Shield & Key Enclosure -->
    <rect x="0" y="0" width="170" height="200" rx="10" fill="#131b2e" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="30" fill="#94a3b8" font-size="12" font-weight="700">RLS POLICY ENGINE</text>

    <!-- Visual Shield Icon -->
    <g transform="translate(45, 50)">
      <path d="M 40 0 L 80 15 L 80 50 Q 80 85 40 100 Q 0 85 0 50 L 0 15 Z" fill="url(#shieldGrad)" opacity="0.85" filter="url(#softGlow)"/>
      <path d="M 40 28 L 52 40 L 35 60 L 26 50" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Status Tags -->
    <rect x="15" y="162" width="65" height="22" rx="11" fill="#065f46" stroke="#10b981" stroke-width="1"/>
    <text x="24" y="177" fill="#6ee7b7" font-size="9" font-weight="700">ABAC ACTIVE</text>

    <rect x="88" y="162" width="67" height="22" rx="11" fill="#312e81" stroke="#818cf8" stroke-width="1"/>
    <text x="96" y="177" fill="#c7d2fe" font-size="9" font-weight="700">ZERO TRUST</text>
  </g>

  <!-- Animated Data Connection Streams (Connecting sides) -->
  <path d="M 230 170 C 330 170, 360 290, 600 290 C 840 290, 870 170, 960 170" fill="none" stroke="url(#pulseCyan)" stroke-width="2" class="anim-flow" opacity="0.6"/>
  <path d="M 230 140 C 360 140, 420 70, 600 70 C 780 70, 840 140, 960 140" fill="none" stroke="url(#pulsePurple)" stroke-width="1.5" class="anim-flow" opacity="0.4"/>

  <!-- Floating Ambient Sparkles/Nodes -->
  <circle cx="280" cy="110" r="3" fill="#38bdf8" class="anim-float1"/>
  <circle cx="340" cy="270" r="2.5" fill="#818cf8" class="anim-float2"/>
  <circle cx="860" cy="100" r="3" fill="#c084fc" class="anim-float3"/>
  <circle cx="910" cy="260" r="2.5" fill="#38bdf8" class="anim-float1"/>

  <!-- FOREGROUND: Crystal Clear Title & Subtitle Badge Layout (Unobstructed) -->
  <!-- Top Category Chip -->
  <g transform="translate(600, 75)">
    <rect x="-185" y="-18" width="370" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="0" y="3" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">ENTERPRISE FINE-GRAINED ACCESS CONTROL</text>
  </g>

  <!-- Primary Headline Title -->
  <text x="600" y="148" text-anchor="middle" font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5" filter="url(#softGlow)">
    Row-Level Data Security
  </text>

  <!-- Subtitle Line 1 -->
  <text x="600" y="195" text-anchor="middle" font-size="18" font-weight="500" fill="#f1f5f9" letter-spacing="0.2">
    The Definitive Landscape for Row Access Policies, ABAC &amp; Data Governance
  </text>

  <!-- Subtitle Line 2 (Technical Keywords) -->
  <text x="600" y="226" text-anchor="middle" font-size="13" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
    Multi-Tenant Data Isolation  •  Dynamic Data Masking  •  Warehouse &amp; Query Proxies
  </text>

  <!-- Interactive/Dynamic Attribute Chips in Center Base -->
  <g transform="translate(600, 275)">
    <!-- Chip 1: Snowflake RAP -->
    <rect x="-240" y="-14" width="110" height="28" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
    <text x="-185" y="4" fill="#7dd3fc" font-size="11" font-weight="600" text-anchor="middle">Snowflake RAP</text>

    <!-- Chip 2: Unity Catalog -->
    <rect x="-120" y="-14" width="110" height="28" rx="6" fill="#0f172a" stroke="#4f46e5" stroke-width="1"/>
    <text x="-65" y="4" fill="#a5b4fc" font-size="11" font-weight="600" text-anchor="middle">Unity Catalog</text>

    <!-- Chip 3: Immuta & Privacera -->
    <rect x="0" y="-14" width="125" height="28" rx="6" fill="#0f172a" stroke="#7c3aed" stroke-width="1"/>
    <text x="62" y="4" fill="#c4b5fd" font-size="11" font-weight="600" text-anchor="middle">Immuta &amp; Ranger</text>

    <!-- Chip 4: Postgres RLS -->
    <rect x="135" y="-14" width="105" height="28" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
    <text x="187" y="4" fill="#6ee7b7" font-size="11" font-weight="600" text-anchor="middle">Postgres RLS</text>
  </g>
</svg>
